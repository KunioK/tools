name: Tools Service CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: |
          cd tools_service
          go test -v ./...

      - name: Build binary
        run: |
          cd tools_service
          CGO_ENABLED=0 GOOS=linux go build -o tools-service .

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tools-service-binary
          path: tools_service/tools-service

  build-and-push-image:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-2bfqurta47ac6mca.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 阿里云个人版 ACR 不支持 OCI empty layer（provenance/SBOM），需关闭
          provenance: false
          sbom: false
          tags: |
            crpi-2bfqurta47ac6mca.cn-shenzhen.personal.cr.aliyuncs.com/kunio/tools:${{ github.sha }}
            crpi-2bfqurta47ac6mca.cn-shenzhen.personal.cr.aliyuncs.com/kunio/tools:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
